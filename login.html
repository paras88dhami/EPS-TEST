<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f4c81">
  <title>Private Access · EPS-TOPIK Practice</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="accessTitle">
      <div class="brand-mark">EPS</div>
      <p class="auth-korean" lang="ko">고용허가제 한국어능력시험</p>
      <h1 id="accessTitle">EPS-TOPIK Practice</h1>
      <p class="auth-eyebrow">PRIVATE ACCESS</p>
      <p class="auth-description">This website is available only to authorized users.</p>
      <button id="googleButton" class="auth-button" type="button" disabled>Continue with Google</button>
      <p id="message" class="auth-message" role="status" aria-live="polite">Checking your access…</p>
      <p class="invite-message">Use the Google account matching the email invited by your administrator.</p>
      <noscript>Enable JavaScript to continue.</noscript>
    </section>
  </main>
  <script src="/js/auth-bundle.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
