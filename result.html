<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f4c81">
  <title>EPS-TOPIK Result</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="result-shell">
    <section class="result-card">
      <p class="result-eyebrow">EPS-TOPIK</p>
      <h1>시험 결과 · Test Result</h1>
      <div class="score-block"><strong id="scoreText">0 / 40</strong><span id="percentText">0%</span></div>
      <div class="score-grid">
        <div><span>읽기 · Reading</span><strong id="readingScore">0 / 20</strong></div>
        <div><span>듣기 · Listening</span><strong id="listeningScore">0 / 20</strong></div>
        <div><span>정답 · Correct</span><strong id="correctCount">0</strong></div>
        <div><span>오답 · Wrong</span><strong id="wrongCount">0</strong></div>
      </div>
      <div class="result-actions"><a class="primary-action" href="test.html">다시 풀기 · Try Again</a><a class="secondary-link" href="index.html">처음으로 · Home</a></div>
    </section>
  </main>
  <script src="js/result.js"></script>
</body>
</html>
